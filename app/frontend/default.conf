# todo-frontend の nginx の設定。画面のファイルを返し、/api/ を todo-api に中継する
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # #region proxy
    # todo-api という名前で API に届ける。Compose ではサービス名、
    # Kubernetes では Service の名前で、同じ名前が使える
    location /api/ {
        proxy_pass http://todo-api:8080;
        # API に届かないときは、待ち続けずに3秒でエラー（504）を返す
        proxy_connect_timeout 3s;
    }
    # #endregion proxy
}
