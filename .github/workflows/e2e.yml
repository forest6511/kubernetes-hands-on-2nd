# 全章の検査（make check）と e2e（scripts/e2e-all.sh）を Ubuntu で流す。
# 本の手順が Linux（と、同じ Ubuntu で動く WSL2）でも通るかを確かめるためのもの
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# bash -eo pipefail で動かす（e2e の出力を tee に通しても、失敗が終了コードに残るように）
defaults:
  run:
    shell: bash

env:
  MINIKUBE_VERSION: v1.39.0
  KUBECTL_VERSION: v1.37.1
  HELM_VERSION: v4.3.1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: app/api/go.mod
          cache-dependency-path: app/api/go.sum
      - name: tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          pip install yamllint
          bash scripts/ci-install-tools.sh kubectl helm
      - run: make check

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: tools
        run: bash scripts/ci-install-tools.sh minikube kubectl helm
      - name: e2e（全章）
        run: bash scripts/e2e-all.sh 2>&1 | tee e2e.log
      - name: 失敗したときのログを残す
        if: failure()
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-log
          path: |
            e2e.log
            docs/logs/
