# わざと失敗させる Deployment: Secret に無いキー（passwd）を参照する
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-api
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      containers:
        - name: api
          image: todo-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: todo-db
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-db
                  # #region typo
                  key: passwd
                  # #endregion typo
            - name: APP_TITLE
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: APP_TITLE
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
