# #region values
# 入れるときに変えられる値（--set で上書きできる）
appTitle: "Todo"

frontend:
  replicas: 1
  image: todo-frontend
  tag: v2

api:
  replicas: 1
  image: todo-api
  tag: v1

db:
  image: postgres:18.6-alpine
  # 前の章で作った PVC と Secret を使う（チャートでは作らない）
  existingClaim: todo-db-data
  existingSecret: todo-db

# HTTPRoute を付ける Gateway の名前（前の章で作ったもの）
gateway: todo-gateway
# #endregion values
