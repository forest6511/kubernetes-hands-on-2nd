# #region deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
  # template は、Deployment が Pod を作るときのひな形
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.6-alpine
          ports:
            - containerPort: 80
# #endregion deployment
