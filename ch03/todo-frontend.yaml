# #region todo-frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-frontend
  template:
    metadata:
      labels:
        app: todo-frontend
    spec:
      containers:
        - name: nginx
          image: todo-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
# #endregion todo-frontend
