apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todo
spec:
  # どの Gateway（入口）に、この振り分けの決まりを付けるか
  parentRefs:
    - name: todo-gateway
  rules:
    # /api で始まるパスは todo-api へ（パスは書き換えない）
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: todo-api
          port: 8080
    # それ以外は画面を返す todo-frontend へ
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: todo-frontend
          port: 80
